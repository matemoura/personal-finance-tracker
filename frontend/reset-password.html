<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - Finance Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <meta name="description" content="Finance Tracker — controle suas receitas, despesas e relatórios financeiros pessoais.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>

<body class="login-screen flex items-center justify-center min-h-screen p-6">

    <div class="login-panel w-full max-w-[420px] bg-white rounded-2xl px-9 py-10">
        <div class="text-center mb-7">
            <div class="w-12 h-12 rounded-xl app-button flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-4 !shadow-none">M</div>
            <h2 class="text-2xl font-extrabold tracking-tight" style="color:var(--app-heading)">Redefinir Senha</h2>
            <p class="text-sm mt-1.5" style="color:var(--app-muted)">Crie uma nova senha segura para sua conta.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label for="newPass" class="block text-xs font-semibold mb-1.5" style="color:var(--app-heading)">Nova Senha</label>
                <input type="password" id="newPass" placeholder="••••••••"
                    class="app-input w-full px-3.5 py-2.5 rounded-lg text-sm transition">
                <p class="text-xs mt-2" style="color:var(--app-muted)">
                    Min 8 caracteres, 1 letra, 1 número e 1 especial (@#$...).
                </p>
            </div>

            <button onclick="doReset()"
                class="app-button w-full font-bold text-sm py-3 rounded-lg transition">
                Alterar Senha
            </button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
</body>

</html>
