<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Finance Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <meta name="description" content="Finance Tracker — controle suas receitas, despesas e relatórios financeiros pessoais.">
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { font-family: 'Public Sans', system-ui, sans-serif; }
    </style>
</head>

<body class="login-screen flex items-center justify-center min-h-screen p-6">

    <button onclick="toggleTheme()" class="icon-btn fixed top-4 right-4 w-9 h-9 rounded-full transition" style="background:var(--app-soft)" title="Alternar tema">
        <span id="theme-icon-desktop"></span>
    </button>

    <div class="login-panel w-full max-w-[420px] rounded-2xl px-9 py-10">
        <div class="text-center mb-7">
            <div class="w-12 h-12 rounded-xl app-button flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-4 !shadow-none">M</div>
            <h2 class="text-2xl font-extrabold tracking-tight" style="color:var(--app-heading)">Recuperar Senha</h2>
            <p class="text-sm mt-1.5" style="color:var(--app-muted)">Digite seu e-mail para receber o link de redefinição.</p>
        </div>

        <div class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-semibold mb-1.5" style="color:var(--app-heading)">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com"
                    class="app-input w-full px-3.5 py-2.5 rounded-lg text-sm transition">
            </div>

            <button onclick="requestReset()"
                class="app-button w-full font-bold text-sm py-3 rounded-lg transition">
                Enviar Link
            </button>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm font-semibold hover:underline" style="color:var(--app-primary)">
                ← Voltar para o Login
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>
</body>

</html>
