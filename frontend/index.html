<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <meta name="description" content="Finance Tracker — controle suas receitas, despesas e relatórios financeiros pessoais.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>

<body class="login-screen flex items-center justify-center min-h-screen p-6">

    <button onclick="toggleTheme()" class="fixed top-4 right-4 w-9 h-9 rounded-full flex items-center justify-center transition" style="background:var(--app-soft)" title="Alternar tema">
        <span id="theme-icon-desktop" class="text-base">🌙</span>
    </button>

    <div class="login-panel w-full max-w-[420px] rounded-2xl px-9 py-10">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl app-button flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-4 !shadow-none">M</div>
            <h1 class="text-2xl font-extrabold tracking-tight" style="color:var(--app-heading)">Bem-vindo</h1>
            <p class="text-sm mt-1.5" style="color:var(--app-muted)">Faça login para gerenciar suas finanças</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-semibold mb-1.5" style="color:var(--app-heading)">E-mail</label>
                <input type="email" id="email" required
                    class="app-input w-full px-3.5 py-2.5 rounded-lg text-sm transition"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold mb-1.5" style="color:var(--app-heading)">Senha</label>
                <input type="password" id="password" required
                    class="app-input w-full px-3.5 py-2.5 rounded-lg text-sm transition"
                    placeholder="••••••••">
                <div class="text-right mt-2">
                    <a href="forgot-password.html"
                        class="text-xs font-semibold hover:underline" style="color:var(--app-primary)">
                        Esqueci minha senha
                    </a>
                </div>
            </div>

            <button type="submit"
                class="app-button w-full font-bold text-sm py-3 rounded-lg transition">
                Entrar
            </button>
        </form>

        <p class="mt-6 text-center text-sm" style="color:var(--app-muted)">
            Não tem uma conta?
            <a href="register.html" class="font-bold hover:underline" style="color:var(--app-primary)">
                Cadastre-se
            </a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
